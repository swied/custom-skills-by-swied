name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py skills
      - run: python scripts/audit_harness_docs.py --check-config-only
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: bash tests/installers-test.sh
      - run: bash tests/swied-markdown-to-pdf-test.sh
